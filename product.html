<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product Details | Loomghar</title>


    <!-- GOOGLE FONTS -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >


    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- YOUR CSS -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- ==============================
     NAVBAR
================================ -->

<header class="header">

    <nav>


        <!-- LOGO -->

        <div class="logo">

            <a href="index.html">

                <img
                    src="img/loomlogo.png"
                    alt="Loomghar Logo"
                >

            </a>

        </div>


        <!-- MENU -->

        <div
            class="menu"
            id="menu"
        >

            <a href="index.html#home">
                Home
            </a>

            <a href="index.html#products">
                Products
            </a>

            <a href="index.html#about">
                About
            </a>

            <a href="index.html#contact">
                Contact
            </a>

        </div>


        <!-- WHATSAPP -->

        <div class="nav-whatsapp">

            <a
                href="https://wa.me/919405403455"
                target="_blank"
            >

                <i class="fa-brands fa-whatsapp"></i>

                <span>WhatsApp</span>

            </a>

        </div>


        <!-- MOBILE MENU -->

        <div
            class="hamburger"
            id="hamburger"
        >

            <i class="fa-solid fa-bars"></i>

        </div>

    </nav>

</header>



<!-- ==============================
     PRODUCT DETAILS
================================ -->

<main class="product-details-page">


    <a
        href="index.html#products"

    >

        <i class="fa-solid fa-arrow-left"></i>

        Back to Products

    </a>


    <div
        id="productDetails"
        class="product-details-container"
    >

        <!-- Product details will load here -->

    </div>


</main>



<!-- ==============================
     FOOTER
================================ -->
<footer>

   <div class="footer-bottom">

    <p></p>

    <p class="created-by">
        Created By
        <a href="https://www.instagram.com/femosysind/"
           target="_blank"
           rel="noopener noreferrer">
            FEMOSYS
        </a>
    </p>

</div>
</footer>



<!-- IMPORTANT:
     script.js FIRST
-->

<script src="script.js"></script>


<!-- PRODUCT DETAILS JS -->

<script src="product-details.js"></script>



<script>

    /* MOBILE MENU */

    const hamburger =
        document.getElementById("hamburger");

    const mobileMenu =
        document.getElementById("menu");


    if (hamburger && mobileMenu) {

        hamburger.addEventListener(
            "click",
            function () {

                mobileMenu.classList.toggle("active");

            }
        );

    }

</script>


</body>

</html>
